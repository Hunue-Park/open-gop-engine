syntax = "proto3";

package recognition;

// Recognition 서비스 정의
service Recognition {
  // 새로운 인식 세션을 생성합니다.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);

  // 평가를 위해 오디오 데이터를 스트리밍하고 인식 결과를 받습니다.
  // 양방향 스트리밍 RPC입니다.
  rpc StreamAudio(stream StreamAudioRequest) returns (stream StreamAudioResponse);

  // 세션의 상태를 가져옵니다.
  rpc GetSessionStatus(GetSessionStatusRequest) returns (GetSessionStatusResponse);

  // 세션을 닫습니다.
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
}

// CreateSession 메시지
message CreateSessionRequest {
  string sentence = 1;
  map<string, string> options = 2; // engine_options 용
}

message CreateSessionResponse {
  string session_id = 1;
  string status = 2;
  string sentence = 3;
  int32 blocks = 4;
}

// StreamAudio 메시지
message StreamAudioRequest {
  oneof request_type {
    StreamConfig config = 1;
    bytes audio_chunk = 2;
  }
}

message StreamConfig {
    string session_id = 1;
}

message StreamAudioResponse {
  string session_id = 1;
  string status = 2; // "in_progress", "completed", "error"
  Result result = 3;
  string error_message = 4;
}

message Word {
    string word = 1;
    float score = 2;
    int64 start_time = 3; // 밀리초
    int64 end_time = 4;   // 밀리초
}

message Result {
    float overall = 1;
    float pronunciation = 2;
    string resource_version = 3;
    repeated Word words = 4;
    bool eof = 5;
}

// GetSessionStatus 메시지
message GetSessionStatusRequest {
  string session_id = 1;
}

message Progress {
    int32 active_block = 1;
    int32 total_blocks = 2;
    float overall_score = 3;
}

message GetSessionStatusResponse {
  string session_id = 1;
  int64 created_at = 2;
  int64 last_activity = 3;
  Progress current_progress = 4;
  bool all_completed = 5;
  string error_message = 6;
}

// CloseSession 메시지
message CloseSessionRequest {
  string session_id = 1;
}

message CloseSessionResponse {
  string status = 1;
  string session_id = 2;
  string error_message = 3;
}